# Optional production backends. `contextflow init` works without any of
# these (SQLite + local vector index). Bring these up when you want
# Postgres / Qdrant / Neo4j instead.
version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: contextflow
      POSTGRES_PASSWORD: contextflow
      POSTGRES_DB: contextflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/contextflow
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  contextflow-api:
    build: .
    command: contextflow serve --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
