[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextflow-engine"
version = "0.1.0"
description = "Open-source context infrastructure for AI agents."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "ContextFlow Contributors" }]
keywords = ["ai", "agents", "rag", "context", "mcp", "retrieval", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.13.5",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
    "mcp==1.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2"]
qdrant = ["qdrant-client>=1.19.0"]
neo4j = ["neo4j>=5.19"]
openai = ["openai>=1.30"]
spacy = ["spacy>=3.7"]  # also needs: python -m spacy download en_core_web_md
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/yourorg/contextflow"
Documentation = "https://github.com/yourorg/contextflow/tree/main/docs"
Issues = "https://github.com/yourorg/contextflow/issues"

[project.scripts]
contextflow = "contextflow.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
# Type-checking target only — this doesn't change the runtime Python
# support range (requires-python above stays ">=3.10", and CI runs the
# actual test suite under 3.10/3.11/3.12). Bumped from 3.10 specifically
# because a numpy version pulled in transitively by the optional `spacy`
# extra ships stub files using PEP 695 `type` statement syntax, which
# mypy refuses to parse when targeting <3.12 — a third-party stub
# compatibility issue, not a statement about what syntax our own code
# uses.
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
